<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔法卡片助手</title>
<style>
  :root{
    --qq-blue:#12b7f5; --qq-blue-d:#0a9bd4; --bg:#f3f4f8; --line:#e6e8ee;
    --text:#222; --muted:#8a909c; --ok:#2ecc71; --warn:#f5a623; --err:#e74c3c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);display:flex;justify-content:center;
    align-items:flex-start;min-height:100vh;padding:28px 16px}
  .app{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;max-width:880px;width:100%}
  .main{flex:1 1 360px;min-width:320px;display:flex;flex-direction:column}
  .side{flex:1 1 380px;min-width:320px;background:#fff;border-radius:12px;
    box-shadow:0 6px 24px rgba(0,0,0,.08);display:flex;flex-direction:column;overflow:hidden}
  .card{background:#fff;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:hidden}
  .head{background:linear-gradient(135deg,var(--qq-blue),var(--qq-blue-d));
    color:#fff;padding:16px 18px;font-size:17px;font-weight:600}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:12px;background:none;border:none;font-size:14px;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--qq-blue);border-bottom-color:var(--qq-blue);font-weight:600}
  .panel{padding:22px;display:flex;flex-direction:column;align-items:center}
  .panel.hidden{display:none}
  .qr-box{width:180px;height:180px;margin:0 auto 14px;border:1px solid var(--line);
    border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fafbfc}
  .qr-box img{width:160px;height:160px;display:block}
  .status{font-size:13px;color:var(--muted);margin-bottom:12px;min-height:18px;text-align:center}
  .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--err)}
  .btn{width:100%;padding:10px;border:none;border-radius:6px;background:#eef1f6;color:var(--text);
    font-size:14px;cursor:pointer;margin-top:6px}
  .btn:hover{background:#e3e7ee}
  .btn.primary{background:var(--qq-blue);color:#fff}
  .btn.primary:hover{background:var(--qq-blue-d)}
  .btn:disabled{opacity:.5;cursor:default}
  .hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
  .dash{padding:20px 22px}
  .dash-head{display:flex;justify-content:space-between;align-items:center;
    padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
  .dash-head b{color:var(--qq-blue)}
  .dash-body p{font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px}
  .spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--qq-blue);
    border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 操作日志 */
  .side .log-title{padding:14px 16px 10px;font-size:13px;color:var(--muted);
    border-bottom:1px solid var(--line)}
  #log{height:430px;overflow-y:auto;padding:10px 12px;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe;white-space:pre-wrap;word-break:break-all;background:#0f1115}
  #log .t{color:#5b6b7a}
  #log .ok{color:#5fd38a}
  #log .warn{color:#ffcf6b}
  #log .err{color:#ff7b7b}
  #log .info{color:#9fd0ff}
</style>
<style>
  .state-box{background:#f7f9fb;border:1px solid #e2e8f0;border-radius:8px;padding:12px;font-size:13px;line-height:1.9}
  .state-box .row{display:flex;justify-content:space-between;border-bottom:1px dashed #e8edf3;padding:2px 0}
  .state-box .row:last-child{border-bottom:none}
  .state-box .k{color:#5a6b7f}
  .state-box .v{font-weight:600;color:#1f2d3d}
  .state-box h4{margin:10px 0 4px;font-size:13px;color:#2b6cb0}
  .state-box .slot{display:inline-block;min-width:150px;margin:2px 8px 2px 0;padding:3px 8px;border-radius:5px;background:#eef4fb;font-size:12px}
  .state-box .done{background:#e6ffed;color:#1a7f37}
  .state-box .busy{background:#fff5e6;color:#a15c00}
  .state-box .empty{background:#f1f3f5;color:#868e96}
  .dash-actions{display:flex;align-items:center;gap:12px;margin:12px 0}
  .dash-actions .btn{width:auto;margin:0;padding:7px 16px}
  .auto{font-size:12px;color:#5a6b7f;display:flex;align-items:center;gap:4px}
  .err{color:#c0392b}
</style>
</head>
<body>
<div class="app">
  <!-- 左：操作区 -->
  <div class="main">
    <!-- 登录视图 -->
    <div id="login-view" class="card">
      <div class="head">魔法卡片助手 · 登录</div>
      <div class="tabs">
        <button class="tab active" data-tab="qr">二维码登录</button>
        <button class="tab" data-tab="quick">快速登录</button>
      </div>
      <div id="tab-qr" class="panel">
        <div class="qr-box"><img id="qr-img" alt="扫码登录"></div>
        <div id="qr-status" class="status">请使用手机 QQ 扫码</div>
        <button id="qr-refresh" class="btn">刷新二维码</button>
      </div>
      <div id="tab-quick" class="panel hidden">
        <div id="quick-info" class="status"><span class="spinner"></span>正在检测本机 QQ…</div>
        <button id="quick-launch" class="btn primary hidden">唤起本机 QQ</button>
        <div class="hint">若未检测到本机 QQ 的一键登录能力，请使用二维码登录。</div>
      </div>
    </div>

    <!-- 登录后视图 -->
    <div id="dash-view" class="card hidden">
      <div class="head">魔法卡片助手</div>
      <div class="dash">
        <div class="dash-head">
          <span>已登录：<b id="dash-uin"></b></span>
          <button id="logout" class="btn" style="width:auto;margin:0;padding:6px 14px">退出</button>
        </div>
        <div class="dash-body">
          <div id="state-box" class="state-box">
            <span class="spinner"></span>正在读取游戏数据…
          </div>
          <div class="dash-actions">
            <button id="refresh-btn" class="btn primary">刷新状态</button>
            <label class="auto"><input type="checkbox" id="auto-refresh" checked> 每 60 秒自动刷新</label>
          </div>
          <button id="probe-btn" class="btn">探测接口（调试）</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 右：操作日志 -->
  <div class="side">
    <div class="log-title">操作日志</div>
    <div id="log"></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
