<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>魔法卡片助手</title>
<style>
  :root{
    --qq-blue:#12b7f5; --qq-blue-d:#0a9bd4; --bg:#eef1f6; --panel:#fff; --line:#e2e6ee;
    --text:#1f2d3d; --muted:#66738a; --ok:#1a9c5a; --warn:#c77700; --err:#d64541;
    --chip-bg:#f6f8fb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px}
  .app{display:flex;flex-direction:column;height:100vh}

  /* ===== 顶部通栏 ===== */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:16px;
    background:linear-gradient(135deg,var(--qq-blue),var(--qq-blue-d));color:#fff;
    padding:0 24px;height:54px}
  .topbar .brand{font-size:17px;font-weight:700;letter-spacing:.5px}
  .topbar .sub{font-size:12px;opacity:.85}
  .topbar .spacer{flex:1}
  .topbar .who{font-size:13px;opacity:.95}

  /* ===== 主内容区 ===== */
  .content{flex:1 1 auto;min-height:0;display:flex;gap:14px;padding:14px 24px 18px}
  .main-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:14px;overflow-y:auto}

  /* ===== 登录卡（居中，非竖条）===== */
  .login-holder{flex:1;display:flex;align-items:flex-start;justify-content:center;
    padding-top:7vh;min-width:0}
  .login-card{width:min(460px,100%);background:var(--panel);border-radius:12px;
    box-shadow:0 8px 30px rgba(20,40,80,.10);overflow:hidden}
  .login-card .head{padding:18px 22px;font-size:16px;font-weight:600;color:var(--text);
    border-bottom:1px solid var(--line)}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:12px;background:none;border:none;font-size:14px;color:var(--muted);
    cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--qq-blue);border-bottom-color:var(--qq-blue);font-weight:600}
  .panel{padding:26px 22px;display:flex;flex-direction:column;align-items:center}
  .panel.hidden{display:none}
  .qr-box{width:200px;height:200px;margin:0 auto 16px;border:1px solid var(--line);
    border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fafbfc}
  .qr-box img{width:180px;height:180px;display:block}
  .status{font-size:13px;color:var(--muted);margin-bottom:12px;min-height:18px;text-align:center}
  .status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--err)}
  .btn{padding:9px 18px;border:none;border-radius:6px;background:#e8ecf3;color:var(--text);
    font-size:14px;cursor:pointer}
  .btn:hover{background:#dde3ec}
  .btn.primary{background:var(--qq-blue);color:#fff}
  .btn.primary:hover{background:var(--qq-blue-d)}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.sm{padding:5px 12px;font-size:13px}
  .btn.block{width:100%;margin-top:8px}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
  .btn.ghost.active{background:var(--qq-blue);border-color:var(--qq-blue);color:#fff}
  .hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6}
  .spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--qq-blue);
    border-radius:50%;display:inline-block;vertical-align:-2px;margin-right:6px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== 主面板 ===== */
  .dash{flex:1;display:flex;flex-direction:column;min-height:0}
  .dash-bar{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--panel);border-radius:10px;padding:8px 16px;margin-bottom:12px;
    box-shadow:0 2px 10px rgba(20,40,80,.06)}
  .dash-bar .who{font-size:14px;margin-right:6px}
  .dash-bar .who b{color:var(--qq-blue)}
  .dash-bar .spacer{flex:1}
  .subnav{display:flex;gap:6px}
  .subnav .btn.ghost.active{background:#eaf6fd;border-color:var(--qq-blue);color:var(--qq-blue-d);font-weight:600}
  .pane{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .pane.hidden{display:none}

  .cards-grid{flex:1 1 auto;min-height:0;display:grid;
    grid-template-columns:minmax(0,1fr) 400px;gap:14px}
  .stat-card{background:var(--panel);border-radius:12px;box-shadow:0 2px 10px rgba(20,40,80,.06);
    padding:18px 20px;overflow-y:auto;min-height:0}
  .stat-card h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px;
    text-transform:uppercase;letter-spacing:.4px}
  .state-box{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
  .stat-chip{background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .stat-chip .k{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
  .stat-chip .v{font-size:15px;font-weight:700;color:var(--text)}
  .stat-chip .v small{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
  .slot-list{margin-top:4px;display:flex;flex-wrap:wrap;gap:8px}
  .slot{display:inline-block;padding:5px 10px;border-radius:6px;background:#edf2f9;
    font-size:12.5px;color:var(--text);white-space:nowrap}
  .slot .sname{color:var(--muted);margin-right:6px}
  .slot.done{background:#e5f8ec;color:#146b3a;border:1px solid #bdebd0}
  .slot.busy{background:#fdf3e2;color:#9a5b00;border:1px solid #f3ddb4}
  .slot.empty{background:#f2f4f7;color:#8a93a3;border:1px dashed #d5dae3}
  .err{color:var(--err)}
  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}

  /* ===== 操作日志控制台 ===== */
  .console{flex:1 1 400px;max-width:420px;min-width:320px;background:#0f1115;
    border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .console .log-title{flex:0 0 auto;padding:10px 14px;font-size:12px;color:#9aa5b5;
    background:#16191f;border-bottom:1px solid #262b33}
  #log{flex:1 1 auto;overflow-y:auto;padding:10px 12px;min-height:0;
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe;white-space:pre-wrap;word-break:break-all}
  #log .t{color:#5b6b7a}
  #log .ok{color:#5fd38a}
  #log .warn{color:#ffcf6b}
  #log .err{color:#ff7b7b}
  #log .info{color:#9fd0ff}

  /* ===== 卡库查询页 ===== */
  .lib{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
  .lib-toolbar{flex:0 0 auto;background:var(--panel);border-radius:12px;
    box-shadow:0 2px 10px rgba(20,40,80,.06);padding:12px 16px;
    display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .lib-toolbar .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .lib-toolbar .seg button{border:none;background:#fff;padding:7px 16px;cursor:pointer;color:var(--muted);font-size:13.5px}
  .lib-toolbar .seg button.active{background:var(--qq-blue);color:#fff}
  .lib-toolbar input[type=text]{border:1px solid var(--line);border-radius:8px;padding:7px 12px;
    font-size:13.5px;width:220px;outline:none}
  .lib-toolbar input[type=text]:focus{border-color:var(--qq-blue)}
  .lib-toolbar .num{width:120px!important}
  .lib-toolbar .sep{width:1px;height:22px;background:var(--line)}
  .lib-toolbar label.check{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}
  .chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .chip{padding:4px 12px;border-radius:14px;border:1px solid var(--line);background:#fff;
    font-size:12.5px;color:var(--muted);cursor:pointer}
  .chip.active{background:var(--qq-blue);border-color:var(--qq-blue);color:#fff}
  .chip.on{background:#eaf6fd;border-color:var(--qq-blue);color:var(--qq-blue-d)}
  .lib-body{flex:1 1 auto;min-height:0;display:grid;
    grid-template-columns:minmax(0,44fr) minmax(0,56fr);gap:14px}
  .lpanel{background:var(--panel);border-radius:12px;box-shadow:0 2px 10px rgba(20,40,80,.06);
    display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .lpanel .lp-head{flex:0 0 auto;padding:10px 14px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:8px}
  .lpanel .lp-head .t{font-weight:600;font-size:13.5px}
  .lpanel .lp-head .cnt{font-size:12px;color:var(--muted)}
  .lpanel .lp-head .spacer{flex:1}
  .lst{flex:1 1 auto;overflow-y:auto;padding:6px}
  .it{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .it:hover{background:#f3f8fc}
  .it.sel{background:#eaf6fd;border-color:var(--qq-blue)}
  .it .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .it .nm{font-weight:600;font-size:13.5px}
  .it .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
  .it .meta{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
  .stars{color:#f5a623;letter-spacing:1px;font-size:12px}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#f0eefc;color:#6b5bd1}
  .tag.flash{background:linear-gradient(90deg,#d8f3ff,#dff0ff);color:#0a7ac2}
  .tag.off{background:#fdeeee;color:#c0392b}
  .tag.base{background:#f0f2f5;color:#7a8699}
  .tag.refinable{background:#e5f8ec;color:#146b3a}
  .v-badge{font-weight:700;font-size:12.5px;color:#1a9c5a;background:#e5f8ec;border-radius:6px;padding:1px 7px}
  .own-badge{font-size:12px;color:var(--qq-blue-d);font-weight:600}
  .empty-tip{color:var(--muted);text-align:center;padding:48px 20px;font-size:13px;line-height:2}
  /* 套卡明细里的卡行 */
  .card-row{padding:7px 10px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px}
  .card-row .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .card-row .recipe{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.7}
  .card-row .recipe .eq{color:var(--text)}
  .chain{margin:6px 0 0 4px;padding-left:14px;border-left:2px solid #d8e6f2;font-size:12.5px;color:var(--text);line-height:1.9}
  .chain .lv{display:flex;gap:6px;align-items:center}
  .chain .arrow{color:var(--muted)}
  .chain .secs{color:var(--muted);font-size:11.5px}
  .lib-foot{flex:0 0 auto;font-size:12px;color:var(--muted);padding:6px 14px;border-top:1px solid var(--line)}
  .mini-btn{border:none;background:#eef4fa;color:#2b6cb0;font-size:12px;padding:2px 9px;border-radius:5px;cursor:pointer}
  .mini-btn:hover{background:#e0ecf8}
  .mini-btn.chain-on{background:#d5e8f7}

  .hidden{display:none!important}
  @media (max-width:1080px){
    .cards-grid{grid-template-columns:minmax(0,1fr)}
    .console{max-width:none;min-width:0;height:260px}
    .lib-body{grid-template-columns:minmax(0,1fr);overflow-y:auto}
    .lpanel{min-height:320px}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">魔法卡片助手</span>
    <span class="sub">自动练卡</span>
    <div class="spacer"></div>
    <span class="who" id="top-user"></span>
  </header>

  <div class="content">
    <!-- 登录视图 -->
    <div id="login-view" class="login-holder hidden">
      <div class="login-card">
        <div class="head">登录</div>
        <div class="tabs">
          <button class="tab active" data-tab="qr">二维码登录</button>
          <button class="tab" data-tab="quick">快速登录</button>
        </div>
        <div id="tab-qr" class="panel">
          <div class="qr-box"><img id="qr-img" alt="扫码登录"></div>
          <div id="qr-status" class="status">请使用手机 QQ 扫码</div>
          <button id="qr-refresh" class="btn block">刷新二维码</button>
        </div>
        <div id="tab-quick" class="panel hidden">
          <div id="quick-info" class="status"><span class="spinner"></span>正在检测本机 QQ…</div>
          <button id="quick-launch" class="btn primary block hidden">唤起本机 QQ</button>
          <div class="hint">若未检测到本机 QQ 的一键登录能力，请使用二维码登录。</div>
        </div>
      </div>
    </div>

    <!-- 主面板 -->
    <div id="dash-view" class="dash hidden">
      <div class="dash-bar">
        <div class="subnav">
          <button class="btn sm ghost active" data-pane="overview">总览</button>
          <button class="btn sm ghost" data-pane="lib">卡库查询</button>
        </div>
        <span class="who">已登录：<b id="dash-uin"></b></span>
        <span class="spacer"></span>
        <button id="refresh-btn" class="btn sm primary hidden">刷新状态</button>
        <label class="auto sm hidden" style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px">
          <input type="checkbox" id="auto-refresh" checked> 60 秒自动刷新
        </label>
        <button id="logout" class="btn sm">退出</button>
      </div>

      <!-- 子页：总览 -->
      <div id="pane-overview" class="pane">
        <div class="cards-grid">
          <div class="stat-card">
            <h3>游戏数据</h3>
            <div id="state-box" class="state-box">
              <span class="spinner"></span>正在读取游戏数据…
            </div>
            <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
              <button id="probe-btn" class="btn sm">探测接口（调试）</button>
            </div>
          </div>
          <div class="console">
            <div class="log-title">操作日志</div>
            <div id="log"></div>
          </div>
        </div>
      </div>

      <!-- 子页：卡库查询 -->
      <div id="pane-lib" class="pane hidden">
        <div class="lib">
          <div class="lib-toolbar" id="lib-toolbar">
            <div class="seg" id="lib-mode">
              <button data-mode="price" class="active">面值查卡</button>
              <button data-mode="theme">浏览套卡</button>
            </div>
            <input type="text" id="lib-kw" placeholder="关键词（卡名 / 套名）">
            <input type="text" id="lib-price" class="num hidden" placeholder="面值，如 40">
            <button id="lib-go" class="btn sm primary">查</button>
            <label class="check hidden" id="lib-own-wrap"><input type="checkbox" id="lib-own"> 只看我持有的</label>
            <div class="sep hidden" id="lib-sep1"></div>
            <div class="chiprow" id="lib-pricechips"></div>
            <div class="chiprow hidden" id="lib-themefilter">
              <span class="chip" data-s="0">全部星级</span>
              <span class="chip" data-s="1">★1</span>
              <span class="chip" data-s="2">★2</span>
              <span class="chip" data-s="3">★3</span>
              <span class="chip" data-s="4">★4</span>
              <span class="chip" data-s="5">★5</span>
            </div>
          </div>

          <div class="lib-body">
            <!-- 左：结果列表 -->
            <div class="lpanel">
              <div class="lp-head">
                <span class="t" id="lst-title">面值查卡</span>
                <span class="cnt" id="lst-cnt"></span>
                <div class="spacer"></div>
              </div>
              <div class="lst" id="lib-list"><div class="empty-tip">输入面值（如 40）点「查」，或点右侧常用面值。<br>支持关键词模糊匹配卡名 / 套名。</div></div>
              <div class="lib-foot" id="lst-foot"></div>
            </div>
            <!-- 右：套卡 / 路径明细 -->
            <div class="lpanel">
              <div class="lp-head">
                <span class="t" id="dt-title">套卡明细</span>
                <span class="cnt" id="dt-sub"></span>
                <div class="spacer"></div>
              </div>
              <div class="lst" id="lib-detail"><div class="empty-tip">在左侧点一张卡 / 一套卡，这里显示它的面值与合成路径。</div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
